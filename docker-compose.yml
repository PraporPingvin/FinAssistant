version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: finroad-postgres
    environment:
      POSTGRES_DB: finroad_db
      POSTGRES_USER: finroad_user
      POSTGRES_PASSWORD: secure_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./server
    container_name: finroad-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finroad_db
      DB_USER: finroad_user
      DB_PASSWORD: secure_password123
    depends_on:
      - postgres

volumes:
  postgres_data: